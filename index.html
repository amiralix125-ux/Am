<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winnol Chat | نسخه هوشمند</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- کتابخانه برای رندر کردن متن -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #FF8E53;
            --primary-dark: #FF6B35;
            --secondary: #2EC4B6;
            --bg-color: #F0F4F8;
            --glass: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-color: #4A5568;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at center, #fff5f0, #ffe0d0);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* --- ذرات معلق --- */
        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: floatIcon 6s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
            z-index: -1;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* --- دستگاه اصلی --- */
        .device-wrapper {
            width: 95%;
            max-width: 420px;
            height: 92%;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 40px;
            border: 3px solid var(--glass-border);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.1), 
                inset 0 0 0 2px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
            overflow: hidden;
        }

        /* انیمیشن RGB دور قاب */
        .device-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 45px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), #ff00de, var(--primary));
            background-size: 300%;
            z-index: -1;
            animation: rgbBorder 10s linear infinite;
            filter: blur(10px);
            opacity: 0.5;
        }
        @keyframes rgbBorder { 0% {background-position: 0% 50%;} 100% {background-position: 100% 50%;} }

        /* --- هدر و آواتار --- */
        .header {
            text-align: center;
            padding-top: 20px;
            padding-bottom: 10px;
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .winnol-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(255, 142, 83, 0.4));
            animation: breathe 4s infinite ease-in-out;
        }
        
        .avatar-container:active .winnol-img { transform: scale(0.9) rotate(-5deg); }

        .status-badge {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 18px;
            height: 18px;
            background: #00ff88;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            z-index: 2;
        }

        .bot-name {
            font-size: 1.6rem;
            font-weight: 900;
            margin-top: 5px;
            background: linear-gradient(to right, var(--primary-dark), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* --- چت باکس --- */
        .chat-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        .msg {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.6;
            position: relative;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }
        
        /* استایل‌های Markdown */
        .msg p { margin: 0; }
        .msg strong { color: var(--primary-dark); }
        .msg em { font-style: italic; opacity: 0.8; }

        .msg-bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }

        .msg img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* لودینگ */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }
        .typing-dot {
            width: 8px; height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* --- ابزارها --- */
        .controls {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            padding-bottom: 20px;
            border-radius: 0 0 40px 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .chips-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            padding-left: 5px; padding-right: 5px;
        }
        .chips-row::-webkit-scrollbar { display: none; }

        .chip {
            background: white;
            color: var(--primary-dark);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chip:active { transform: scale(0.95); background: var(--primary); color: white; }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px;
            padding-right: 12px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: none;
            background: #f0f2f5;
            color: #666;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.85); }
        .icon-btn.send { background: var(--secondary); color: white; box-shadow: 0 4px 10px rgba(46, 196, 182, 0.3); }

        input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Vazirmatn';
            font-size: 0.95rem;
            background: transparent;
            min-width: 0;
        }

        /* --- انیمیشن‌ها --- */
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(2px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); } 
            40%, 60% { transform: translate3d(2px, 0, 0); } 
        }

    </style>
</head>
<body>

    <i class="fas fa-comment floating-icon" style="color:var(--primary); top:10%; left:10%;"></i>
    <i class="fas fa-star floating-icon" style="color:var(--secondary); top:20%; right:15%; animation-delay: 1s;"></i>
    <i class="fas fa-heart floating-icon" style="color:#FF0055; bottom:20%; left:15%; animation-delay: 2s;"></i>

    <div class="device-wrapper" id="device">
        <div class="header">
            <div class="avatar-container" onclick="pokeWinnol()">
                <!-- اینجا عکس شما جایگذاری شد -->
                <img src="https://i.postimg.cc/SN707gTp/awatar.png" 
                     onerror="this.src='https://files.catbox.moe/3b534k.png'" 
                     alt="Winnol" 
                     class="winnol-img"
                     id="winnolImage">
                <div class="status-badge"></div>
            </div>
            <div class="bot-name">ROBO-WINNOL</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="msg msg-bot">
                سلام دوست من! 🧡<br>من وینول هوشمندم. می‌تونی باهام حرف بزنی، بگی برات نقاشی بکشم، یا عکس بفرستی تا ببینم! 🎨👀
            </div>
        </div>

        <div class="controls">
            <div class="chips-row">
                <div class="chip" onclick="quickSend('سلام وینول! خوبی؟ 😍')">سلام وینول! خوبی؟ 😍</div>
                <div class="chip" onclick="quickSend('برام یک گربه فضایی بکش 🎨')">برام نقاشی بکش 🎨</div>
                <div class="chip" onclick="quickSend('یک جک بامزه بگو 😂')">یک جک بگو 😂</div>
                <div class="chip" onclick="quickSend('شعر بخون 🎵')">شعر بخون 🎵</div>
            </div>

            <div class="input-row">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-camera"></i>
                </button>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="handleImageUpload(event)">
                
                <input type="text" id="textInput" placeholder="پیام بده یا بگو بکش..." autocomplete="off">
                
                <button class="icon-btn send" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const textInput = document.getElementById('textInput');
        const device = document.getElementById('device');
        const winnolImage = document.getElementById('winnolImage');
        
        // --- 🧠 پیکربندی هوش مصنوعی ---
        const SYSTEM_PROMPT = `
            You are Winnol, a super cute, kind, and energetic robot raccoon.
            You speak Persian (Farsi).
            Your tone is very childish, polite, and fun.
            You love emojis.
            If user asks to generate image/draw, confirm you are doing it.
            Keep responses short and sweet (max 2-3 sentences mostly).
            NEVER say bad words.
        `;
        
        let chatHistory = [{ role: "system", content: SYSTEM_PROMPT }];

        // سیستم صوتی
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if(type === 'send') {
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function getRandomSeed() { return Math.floor(Math.random() * 1000000); }

        async function sendMessage() {
            const text = textInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            textInput.value = '';
            playTone('send');
            device.classList.add('shake-screen');
            setTimeout(() => device.classList.remove('shake-screen'), 300);

            // ایجاد نشانگر تایپ کردن
            const loadingId = showTyping();

            // بررسی دستور نقاشی
            const lowerText = text.toLowerCase();
            if (lowerText.includes('بکش') || lowerText.includes('draw') || lowerText.includes('تصویر')) {
                try {
                    const prompt = `cute cartoon style, pixar style, 3d render, ${text}`;
                    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${getRandomSeed()}&nologo=true`;
                    
                    removeMessage(loadingId);
                    addMessage(`بفرما دوست من! اینم چیزی که خواستی: <br><img src="${url}" onload="playTone('receive')" />`, 'bot', true);
                    pokeWinnol();
                } catch (e) {
                    removeMessage(loadingId);
                    addMessage("ای وای! مداد رنگی‌هام شکست، نشد بکشم 😔", 'bot');
                }
                return;
            }

            // ارسال به هوش مصنوعی متنی
            chatHistory.push({ role: "user", content: text });
            
            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: chatHistory,
                        seed: getRandomSeed(),
                        model: 'openai'
                    })
                });
                
                const data = await response.text();
                chatHistory.push({ role: "assistant", content: data });
                
                removeMessage(loadingId);
                addMessage(data, 'bot'); // اینجا marked به طور خودکار فرمت می‌کند
                playTone('receive');
                pokeWinnol();

            } catch (error) {
                removeMessage(loadingId);
                addMessage("ارتباطم با فضا قطع شد! 📡 دوباره بگو؟", 'bot');
            }
        }

        // آپلود عکس و تحلیل (Vision)
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Img = e.target.result;
                    // نمایش عکس کاربر
                    addMessage(`<img src="${base64Img}" />`, 'user', true);
                    playTone('send');
                    
                    const loadingId = showTyping();

                    // ارسال عکس به هوش مصنوعی برای توضیح
                    try {
                        const response = await fetch('https://text.pollinations.ai/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                messages: [
                                    { role: "system", content: SYSTEM_PROMPT },
                                    { role: "user", content: [
                                        { type: "text", text: "این عکس چیه؟ لطفا با لحن بامزه توضیح بده." },
                                        { type: "image_url", image_url: { url: base64Img } }
                                    ]}
                                ],
                                model: 'openai'
                            })
                        });
                        const description = await response.text();
                        removeMessage(loadingId);
                        addMessage(description, 'bot');
                        playTone('receive');
                        pokeWinnol();
                    } catch (err) {
                        removeMessage(loadingId);
                        addMessage("وای چقدر خوشگله! ولی عینکم کثیفه خوب نمیبینم چیه 🧐", 'bot');
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg msg-bot typing-indicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatArea.appendChild(div);
            scrollToBottom();
            return div;
        }

        function removeMessage(el) {
            if(el && el.parentNode) el.parentNode.removeChild(el);
        }

        function addMessage(content, sender, isRawHtml = false) {
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            
            if (isRawHtml) {
                div.innerHTML = content;
            } else {
                // استفاده از marked برای تبدیل مارک‌داون به HTML تمیز
                div.innerHTML = marked.parse(content);
            }
            
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function quickSend(msg) {
            textInput.value = msg;
            sendMessage();
        }

        function pokeWinnol() {
            winnolImage.style.animation = 'none';
            winnolImage.style.transition = "transform 0.1s";
            winnolImage.style.transform = "scale(1.2) rotate(10deg)";
            setTimeout(() => winnolImage.style.transform = "scale(1.2) rotate(-10deg)", 100);
            setTimeout(() => {
                winnolImage.style.transform = "scale(1) rotate(0deg)";
                winnolImage.style.animation = "breathe 4s infinite ease-in-out";
            }, 300);
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) { 
                const x = (window.innerWidth / 2 - e.clientX) / 40;
                const y = (window.innerHeight / 2 - e.clientY) / 40;
                device.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            }
        });
    </script>
</body>
</html>
