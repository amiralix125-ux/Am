<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM AI Chat</title>
    <style>
        /* استایل‌های گرافیکی (CSS) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 450px; height: 90vh; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        .chat-header { background-color: #2c2c2c; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; font-size: 1.2rem; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; background-color: #00e676; border-radius: 50%; box-shadow: 0 0 5px #00e676; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scrollbar-width: thin; scrollbar-color: #444 #1e1e1e; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; position: relative; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, #007bff, #0056b3); color: white; border-bottom-left-radius: 2px; }
        .message.bot { align-self: flex-start; background-color: #2a2a2a; color: #ddd; border: 1px solid #333; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 15px; background-color: #2c2c2c; border-top: 1px solid #333; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background-color: #1a1a1a; color: white; outline: none; transition: border 0.3s; }
        input[type="text"]:focus { border-color: #007bff; }
        button { padding: 10px 20px; border-radius: 25px; border: none; background-color: #007bff; color: white; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        .loading { font-size: 0.8rem; opacity: 0.7; font-style: italic; margin-top: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        WM AI Assistant
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot">سلام! چطور می‌تونم کمکت کنم؟ 👋</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()" id="send-btn">ارسال</button>
    </div>
</div>

<script>
    // آدرس وب‌هوک n8n شما (از اسکرین‌شات‌ها استخراج شده)
    const WEBHOOK_URL = 'https://34109-qzpoy.s3.irann8n.com/webhook/win1';

    const messageContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // ارسال با زدن دکمه Enter
    userInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. نمایش پیام کاربر
        addMessage(text, 'user');
        userInput.value = '';
        
        // غیرفعال کردن دکمه هنگام ارسال
        sendBtn.disabled = true;
        sendBtn.innerText = '...';

        try {
            // 2. ارسال به n8n
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatInput: text }) 
            });

            if (response.ok) {
                const data = await response.json();
                // 3. نمایش پاسخ ربات (فرض بر این است که پاسخ در فیلد output است)
                // اگر n8n خروجی دیگری می‌دهد، اینجا باید تغییر کند.
                const botReply = data.output || data.text || data.message || JSON.stringify(data);
                addMessage(botReply, 'bot');
            } else {
                addMessage('خطا در ارتباط با سرور.', 'bot');
                console.error('Server Error:', response.status);
            }

        } catch (error) {
            addMessage('مشکل در اتصال به اینترنت یا سرور.', 'bot');
            console.error('Fetch Error:', error);
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = 'ارسال';
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.innerText = text;
        messageContainer.appendChild(div);
        messageContainer.scrollTop = messageContainer.scrollHeight; // اسکرول به پایین
    }
</script>

</body>
</html>
