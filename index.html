<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت هوشمند</title>

    <style>
        body {
            font-family: sans-serif;
            background: #0f0f0f;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: #1c1c1c;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            text-align: center;
            font-weight: bold;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 10px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .user .bubble {
            background: #6366f1;
            color: #fff;
        }

        .bot .bubble {
            background: #2c2c2c;
            color: #e5e7eb;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #111;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #6366f1;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <header>چت هوش مصنوعی</header>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." />
        <button id="send-btn" onclick="sendMessage()">ارسال</button>
    </div>
</div>

<!-- ✅ اتصال جاوااسکریپت -->
<script src="script.js"></script>

</body>
</html>
