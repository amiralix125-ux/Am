<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هوش مصنوعی وینول | نسخه پیشرفته</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-digits/font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8E53; /* نارنجی وینول */
            --primary-dark: #FF6B35;
            --secondary: #2EC4B6; /* فیروزه‌ای */
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-color: #4A5568;
            --bg-gradient: radial-gradient(circle at center, #fff5f0, #ffe0d0);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* --- ذرات معلق --- */
        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: floatIcon 6s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
            z-index: -1;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* --- دستگاه اصلی --- */
        .device-wrapper {
            width: 95%;
            max-width: 450px;
            height: 92%;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 40px;
            border: 3px solid var(--glass-border);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.1), 
                inset 0 0 0 2px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
            overflow: hidden;
        }

        /* انیمیشن RGB دور قاب */
        .device-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 45px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), #ff00de, var(--primary));
            background-size: 300%;
            z-index: -1;
            animation: rgbBorder 10s linear infinite;
            filter: blur(10px);
            opacity: 0.5;
        }
        @keyframes rgbBorder { 0% {background-position: 0% 50%;} 100% {background-position: 100% 50%;} }

        /* --- هدر --- */
        .header {
            text-align: center;
            padding-top: 15px;
            padding-bottom: 10px;
            position: relative;
            z-index: 20;
            flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .winnol-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(255, 142, 83, 0.4));
            animation: breathe 4s infinite ease-in-out;
        }
        
        .avatar-container:active .winnol-img { transform: scale(0.9) rotate(-5deg); }

        .status-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 15px;
            height: 15px;
            background: #00ff88;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            z-index: 2;
        }

        .bot-name {
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 5px;
            background: linear-gradient(to right, var(--primary-dark), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* انتخاب مدل */
        .model-select-wrapper {
            margin-top: 5px;
            display: flex;
            justify-content: center;
        }
        
        .model-select {
            font-family: 'Vazirmatn';
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 15px;
            border: 1px solid var(--primary);
            background: rgba(255,255,255,0.5);
            color: var(--primary-dark);
            outline: none;
            cursor: pointer;
        }

        /* --- چت باکس --- */
        .chat-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }

        .msg-assistant {
            align-self: flex-start; /* سمت راست برای فارسی */
            background: white;
            color: var(--text-color);
            border-bottom-right-radius: 4px;
            border: 1px solid white;
        }

        .msg-user {
            align-self: flex-end; /* سمت چپ برای فارسی */
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }

        .msg img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* --- کنترل‌ها --- */
        .controls {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            padding-bottom: 25px;
            border-radius: 0 0 40px 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .chips-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            padding-left: 5px; padding-right: 5px;
        }
        .chips-row::-webkit-scrollbar { display: none; }

        .chip {
            background: white;
            color: var(--primary-dark);
            border: 1px solid var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chip:active { transform: scale(0.95); background: var(--primary); color: white; }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px;
            padding-right: 6px;
            padding-left: 6px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: none;
            background: #f0f2f5;
            color: #666;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.85); }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .icon-btn.send { background: var(--secondary); color: white; box-shadow: 0 4px 10px rgba(46, 196, 182, 0.3); }

        input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Vazirmatn';
            font-size: 1rem;
            background: transparent;
            min-width: 0;
            padding: 0 10px;
            text-align: right;
            direction: rtl;
        }

        /* --- انیمیشن‌ها و لودینگ --- */
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(2px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); } 
            40%, 60% { transform: translate3d(2px, 0, 0); } 
        }

        /* لودینگ نقطه‌ای */
        .loading-dots { display: inline-flex; gap: 4px; align-items: center; height: 20px;}
        .loading-dot {
            width: 6px; height: 6px;
            background: var(--text-color);
            border-radius: 50%;
            animation: loading 1.4s infinite ease-in-out;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loading { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .error-msg { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }

    </style>
</head>
<body>

    <!-- ذرات پس زمینه -->
    <i class="fas fa-comment floating-icon" style="color:var(--primary); top:10%; left:10%;"></i>
    <i class="fas fa-star floating-icon" style="color:var(--secondary); top:20%; right:15%; animation-delay: 1s;"></i>
    <i class="fas fa-heart floating-icon" style="color:#FF0055; bottom:20%; left:15%; animation-delay: 2s;"></i>

    <div class="device-wrapper" id="device">
        <div class="header">
            <div class="avatar-container" onclick="ui.pokeWinnol()">
                <!-- عکس کاراکتر وینول -->
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" 
                     alt="Winnol" 
                     class="winnol-img"
                     id="winnolImage">
                <div class="status-badge"></div>
            </div>
            <div class="bot-name">هوش مصنوعی وینول</div>
            
            <div class="model-select-wrapper">
                <select id="modelSelect" class="model-select">
                    <option value="openai/gpt-4o-mini">GPT-4o Mini (سریع)</option>
                    <option value="openai/gpt-4o">GPT-4o (هوشمند)</option>
                    <option value="google/gemini-pro">Gemini Pro</option>
                    <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1</option>
                </select>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="msg msg-assistant">
                سلام دوست من! 🧡<br>من وینول هستم، هوش مصنوعی شخصی شما. چطور می‌تونم امروز کمکت کنم؟ 🎨✨
            </div>
        </div>

        <div class="controls">
            <div class="chips-row">
                <div class="chip" onclick="chat.sendQuickMessage('یک جک بامزه بگو 😂')">جک بگو 😂</div>
                <div class="chip" onclick="chat.sendQuickMessage('ایده برای شام چی داری؟ 🍕')">شام چی بخورم؟</div>
                <div class="chip" onclick="chat.sendQuickMessage('یک داستان کوتاه بنویس 📚')">داستان کوتاه</div>
                <div class="chip" onclick="chat.sendQuickMessage('وضعیت؟ 📊')">وضعیت؟</div>
            </div>

            <div class="input-row">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-camera"></i>
                </button>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="ui.handleImageUpload(event)">
                
                <input type="text" id="textInput" placeholder="پیام خود را بنویسید..." autocomplete="off">
                
                <button class="icon-btn send" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- کلاس مدیریت رابط کاربری (صدا، انیمیشن) ---
        class UIHandler {
            constructor() {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.winnolImage = document.getElementById('winnolImage');
                this.device = document.getElementById('device');
                this.chatArea = document.getElementById('chatArea');
                
                // افکت چرخش سه بعدی موس
                document.addEventListener('mousemove', (e) => {
                    if(window.innerWidth > 768) { 
                        const x = (window.innerWidth / 2 - e.clientX) / 50;
                        const y = (window.innerHeight / 2 - e.clientY) / 50;
                        this.device.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
                    }
                });
            }

            playTone(type) {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain); gain.connect(this.audioCtx.destination);
                const now = this.audioCtx.currentTime;

                if(type === 'send') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'receive') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            }

            pokeWinnol() {
                this.winnolImage.style.animation = 'none';
                this.winnolImage.style.transition = "transform 0.1s";
                this.winnolImage.style.transform = "scale(1.2) rotate(10deg)";
                setTimeout(() => { this.winnolImage.style.transform = "scale(1.2) rotate(-10deg)"; }, 100);
                setTimeout(() => {
                    this.winnolImage.style.transform = "scale(1) rotate(0deg)";
                    this.winnolImage.style.animation = "breathe 4s infinite ease-in-out";
                }, 300);
                this.playTone('receive'); 
            }

            shakeScreen() {
                this.device.classList.add('shake-screen');
                setTimeout(() => this.device.classList.remove('shake-screen'), 300);
            }

            addMessage(role, content, isImage = false) {
                const div = document.createElement('div');
                div.className = `msg msg-${role}`;
                div.innerHTML = content;
                this.chatArea.appendChild(div);
                
                setTimeout(() => {
                    this.chatArea.scrollTo({ top: this.chatArea.scrollHeight, behavior: 'smooth' });
                }, 50);
            }

            handleImageUpload(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imgTag = `<img src="${e.target.result}" alt="User Photo">`;
                        this.addMessage('user', imgTag, true);
                        this.playTone('send');
                        // ارسال کانتکست متنی به چت بات
                        chat.sendMessage("من یک تصویر برای شما ارسال کردم (تصویر را در نظر بگیر و نظر بده).", true);
                    }
                    reader.readAsDataURL(file);
                }
            }
        }

        // --- کلاس منطق چت و API ---
        class OpenRouterChat {
            constructor() {
                this.apiKey = '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';
                this.messages = [];
                this.isLoading = false;
                
                this.input = document.getElementById('textInput');
                this.sendBtn = document.getElementById('sendButton');
                this.modelSelect = document.getElementById('modelSelect');
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });
            }
            
            sendQuickMessage(text) {
                this.input.value = text;
                this.sendMessage();
            }

            async sendMessage(customText = null, isImageContext = false) {
                const text = customText || this.input.value.trim();
                // اگر متن خالی بود و کانتکست عکس هم نبود برگرد
                if (!text && !isImageContext) return;
                if (this.isLoading) return;

                // اگر پیام متنی کاربر است، در چت نشان بده
                if (!isImageContext) {
                    ui.addMessage('user', text);
                    this.input.value = '';
                    ui.playTone('send');
                    ui.shakeScreen();
                }

                // اضافه کردن به حافظه
                this.messages.push({ role: 'user', content: text });
                
                // حالت لودینگ
                this.setLoading(true);
                const loadingDiv = this.addLoadingIndicator();
                
                try {
                    const response = await this.callOpenRouter();
                    loadingDiv.remove(); // حذف لودینگ
                    
                    if (response.choices && response.choices[0]) {
                        const botReply = response.choices[0].message.content;
                        ui.addMessage('assistant', botReply); // نمایش پاسخ
                        this.messages.push({ role: 'assistant', content: botReply });
                        
                        ui.playTone('receive');
                        ui.pokeWinnol(); // خوشحالی ربات
                    }
                } catch (error) {
                    loadingDiv.remove();
                    ui.addMessage('assistant error-msg', `خطا در ارتباط: ${error.message}`);
                } finally {
                    this.setLoading(false);
                }
            }
            
            async callOpenRouter() {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Winnol AI'
                    },
                    body: JSON.stringify({
                        model: this.modelSelect.value,
                        messages: this.messages,
                        temperature: 0.7,
                        max_tokens: 1000
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || 'خطای شبکه');
                }
                return await response.json();
            }

            addLoadingIndicator() {
                const div = document.createElement('div');
                div.className = 'msg msg-assistant';
                div.innerHTML = `
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>`;
                document.getElementById('chatArea').appendChild(div);
                document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
                return div;
            }
            
            setLoading(loading) {
                this.isLoading = loading;
                this.sendBtn.disabled = loading;
                this.input.disabled = loading;
                this.sendBtn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i>' : '<i class="fas fa-paper-plane"></i>';
            }
        }

        // راه‌اندازی
        const ui = new UIHandler();
        const chat = new OpenRouterChat();

    </script>
</body>
</html>
