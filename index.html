<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WM AI</title>
    <style>
        :root {
            --brick-orange: #C55A1C;
            --navy: #141A26;
            --charcoal: #1E222B;
            --warm-silver: #E3E6EB;
            --silver-light: #F1F3F7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, "Segoe UI", sans-serif;
            background-color: #f2f4f8;
            /* این خط معجزه می‌کند: ارتفاع دقیق موبایل */
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden; /* جلوگیری از اسکرول کل صفحه */
        }

        /* ===== هدر (ثابت بالا) ===== */
        .hero {
            direction: ltr;
            background: linear-gradient(180deg, var(--navy), var(--charcoal));
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--brick-orange);
            flex-shrink: 0;
            z-index: 10;
        }

        .hero h1 {
            margin: 0;
            font-size: 24px; /* کمی کوچک‌تر برای موبایل */
            letter-spacing: 4px;
            color: #fff;
        }

        .hero h1 span { color: var(--brick-orange); }

        .hero p {
            margin-top: 5px;
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, .6);
            margin-bottom: 0;
        }

        /* ===== فضای چت (وسط) ===== */
        .chat-container {
            flex-grow: 1; /* پر کردن فضای خالی */
            position: relative;
            overflow-y: auto; /* اسکرول فقط اینجا */
            background: linear-gradient(180deg, #eef1f6, #dde3ee);
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 20px;
        }

        /* واترمارک */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px; /* سایز مناسب موبایل */
            letter-spacing: 10px;
            font-weight: 600;
            color: rgba(20, 26, 38, .06);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* ===== پیام‌ها ===== */
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            z-index: 1;
        }

        .msg.bot {
            align-self: flex-start;
            background: #fff;
            border-radius: 18px 18px 18px 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,.05);
            color: #333;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(145deg, rgba(197, 90, 28, .12), rgba(122, 127, 85, .08));
            border-left: 3px solid var(--brick-orange);
            border-radius: 18px 18px 4px 18px;
            color: #000;
        }

        /* ===== فوتر (ثابت پایین) ===== */
        .footer {
            background: #fff;
            padding: 10px 15px;
            border-top: 1px solid rgba(0,0,0,.1);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0; /* جلوگیری از جمع شدن */
            z-index: 20;
        }

        .footer input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .footer input:focus {
            border-color: var(--brick-orange);
            background: #fff;
        }

        .footer button {
            background: var(--brick-orange);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .footer button:disabled {
            background: #ccc;
        }

    </style>
</head>
<body>

    <!-- هدر -->
    <div class="hero">
        <h1><span>WM</span> AI</h1>
        <p>WINWIN</p>
    </div>

    <!-- فضای چت -->
    <div class="chat-container" id="chat-box">
        <div class="watermark">WINWIN</div>
        <div class="msg bot">سلام! من هوش مصنوعی WM هستم. چطور می‌تونم کمکت کنم؟ 🤚</div>
    </div>

    <!-- فوتر ورودی -->
    <div class="footer">
        <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">ارسال</button>
    </div>

    <!-- جاوااسکریپت -->
    <script>
        // آدرس نهایی وب‌هوک
        const WEBHOOK_URL = 'https://34109-qzpoy.s3.irann8n.com/webhook-test/win1';

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // ارسال با Enter
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('msg', sender);
            div.innerText = text;
            chatBox.appendChild(div);
            // اسکرول نرم به پایین
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // نمایش پیام کاربر
            appendMessage(text, 'user');
            userInput.value = '';

            // حالت لودینگ
            sendBtn.disabled = true;
            sendBtn.innerText = '...';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (response.ok) {
                    const data = await response.json();
                    // پشتیبانی از فرمت‌های مختلف خروجی n8n
                    const botReply = data.output || data.text || data.message || JSON.stringify(data);
                    appendMessage(botReply, 'bot');
                } else {
                    appendMessage('خطا در دریافت پاسخ.', 'bot');
                }
            } catch (error) {
                console.error(error);
                appendMessage('مشکل در اتصال اینترنت.', 'bot');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'ارسال';
                // فوکوس مجدد روی اینپوت (اختیاری در موبایل برای جلوگیری از باز شدن ناخواسته کیبورد)
                // userInput.focus(); 
            }
        }
    </script>
</body>
</html>
